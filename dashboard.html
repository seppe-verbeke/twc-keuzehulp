<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuzehulp Dashboard — The Workspace Company</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F5F7FA;color:#1a1a1a;min-height:100vh}
.top{background:#fff;border-bottom:1px solid #EBEBEB;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top-left{display:flex;align-items:center;gap:12px}
.top-icon{width:32px;height:32px;background:#F0FAF9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.top-title{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:#111}
.top-sub{font-size:11px;color:#999}
.top-right{display:flex;align-items:center;gap:10px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:#F0FAF9;color:#3FA49C;border:1px solid #C5EAE7}
.badge.err{background:#FEF2F2;color:#DC2626;border-color:#FECACA}
.btn{background:none;border:1px solid #EBEBEB;border-radius:6px;padding:5px 12px;font-size:12px;color:#555;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{border-color:#3FA49C;color:#3FA49C}
.last-updated{font-size:11px;color:#BBB}
.main{padding:24px 32px;max-width:1280px;margin:0 auto}

/* Tool tabs */
.tool-tabs{display:flex;gap:8px;margin-bottom:20px}
.tool-tab{background:#fff;border:1.5px solid #EBEBEB;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;color:#777;cursor:pointer;font-family:inherit;transition:all .15s}
.tool-tab:hover{border-color:#3FA49C;color:#3FA49C}
.tool-tab.active{background:#3FA49C;border-color:#3FA49C;color:#fff}

/* Period filter */
.period-bar{display:flex;gap:6px;margin-bottom:20px;align-items:center}
.section-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#AAA;margin-bottom:0;margin-right:8px}
.period-btn{background:none;border:1px solid #EBEBEB;border-radius:6px;padding:5px 14px;font-size:12px;color:#777;cursor:pointer;font-family:inherit;transition:all .15s}
.period-btn:hover{border-color:#3FA49C;color:#3FA49C}
.period-btn.active{background:#3FA49C;border-color:#3FA49C;color:#fff}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #EBEBEB;border-radius:8px;padding:18px 20px;position:relative}
.kpi.accent{border-top:3px solid #3FA49C}
.kpi-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#AAA;margin-bottom:8px}
.kpi-val{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;color:#111;line-height:1}
.kpi-sub{font-size:11px;color:#AAA;margin-top:5px}
.kpi-pct{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;position:absolute;top:16px;right:16px}
.kpi-pct.pos{background:#F0FAF9;color:#0F766E}
.kpi-pct.neu{background:#F5F7FA;color:#888}

/* Funnel */
.funnel-card{background:#fff;border:1px solid #EBEBEB;border-radius:8px;padding:20px 24px;margin-bottom:20px}
.card-title{font-size:13px;font-weight:600;color:#111;margin-bottom:16px}
.funnel-wrap{display:flex;align-items:flex-end;gap:0}
.funnel-step{flex:1;display:flex;flex-direction:column;align-items:center}
.funnel-bar{border-radius:6px 6px 0 0;width:60%;transition:height .6s}
.funnel-bar.f1{background:#3FA49C}
.funnel-bar.f2{background:#60C4BC}
.funnel-bar.f3{background:#A8DED9}
.funnel-meta{text-align:center;padding-top:10px}
.funnel-meta-label{font-size:12px;font-weight:600;color:#333}
.funnel-meta-count{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:#111}
.funnel-meta-pct{font-size:11px;color:#AAA}
.funnel-arrow{flex:0 0 32px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:42px;color:#CCC;font-size:20px}
.funnel-drop{font-size:9px;font-weight:700;color:#E44;margin-top:2px}

/* Cards */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.row3{display:grid;grid-template-columns:3fr 1fr;gap:16px;margin-bottom:20px}
.card{background:#fff;border:1px solid #EBEBEB;border-radius:8px;padding:20px 24px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-label{font-size:12px;color:#555;width:190px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-wrap{flex:1;background:#F5F7FA;border-radius:4px;height:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:#3FA49C;transition:width .6s}
.bar-fill.b2{background:#60C4BC}
.bar-fill.b3{background:#A8DED9}
.bar-count{font-size:11px;color:#AAA;width:28px;text-align:right;flex-shrink:0}

/* Timeline */
.chart-wrap{position:relative;width:100%;height:200px}

/* Table */
.evt-table{width:100%;border-collapse:collapse;font-size:12px}
.evt-table th{text-align:left;padding:7px 10px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#AAA;border-bottom:1px solid #EBEBEB}
.evt-table td{padding:7px 10px;border-bottom:1px solid #F5F7FA;color:#444}
.evt-table tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.tag-start{background:#EEF2FF;color:#4F46E5}
.tag-choice{background:#FFF7ED;color:#C2410C}
.tag-result{background:#F0FAF9;color:#0F766E}
.tag-restart{background:#FDF4FF;color:#7E22CE}

/* Meta */
.lang-pill{background:#F5F7FA;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;color:#555;display:inline-flex;align-items:center;gap:6px}
.lang-pill .cnt{color:#3FA49C;font-weight:700}
.meta-row{display:flex;gap:8px;flex-wrap:wrap}
.loading{text-align:center;padding:60px;color:#AAA;font-size:14px}
.empty{text-align:center;padding:24px;color:#CCC;font-size:12px}

@media(max-width:900px){
  .kpi-row{grid-template-columns:1fr 1fr}
  .row2,.row3{grid-template-columns:1fr}
  .main{padding:16px}
  .top{padding:12px 16px}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-left">
    <div class="top-icon">📊</div>
    <div>
      <div class="top-title">Keuzehulp Dashboard</div>
      <div class="top-sub">The Workspace Company — live tracking</div>
    </div>
  </div>
  <div class="top-right">
    <span class="badge" id="status-badge">Laden...</span>
    <button class="btn" onclick="loadData()">↺ Vernieuwen</button>
    <span class="last-updated" id="last-updated"></span>
  </div>
</div>

<div class="main">
  <!-- Tool tabs -->
  <div class="tool-tabs">
    <button class="tool-tab active" onclick="setTool('all')" id="tab-all">💻🪑 Alles</button>
    <button class="tool-tab" onclick="setTool('laptops')" id="tab-laptops">💻 Laptops & Desktops</button>
    <button class="tool-tab" onclick="setTool('stoelen')" id="tab-stoelen">🪑 Bureaustoelen</button>
  </div>

  <!-- Period filter -->
  <div class="period-bar">
    <span class="section-label">Periode:</span>
    <button class="period-btn" onclick="setPeriod(1)" id="p1">Vandaag</button>
    <button class="period-btn" onclick="setPeriod(7)" id="p7">7 dagen</button>
    <button class="period-btn active" onclick="setPeriod(30)" id="p30">30 dagen</button>
    <button class="period-btn" onclick="setPeriod(0)" id="p0">Alles</button>
  </div>

  <div id="content"><div class="loading">Data laden...</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var SHEET_URL='https://script.google.com/macros/s/AKfycbx_UmVZsveDAb36OCvzoxM-KBGU2peH-nCeto3cRFbd6hUhZu2KjDGo0_ycJAqKo1s/exec';
var ALL_ROWS=[];
var PERIOD=30;
var TOOL='all';
var tlChart=null;

var LAPTOP_LABELS={
  'dt-gaming':'Gaming desktop','dt-office':'Zakelijke desktop',
  'mac-light':'MacBook Air/Neo','mac-pro':'MacBook Pro',
  'win-light':'Windows — Dagelijks','win-gaming-casual':'Gaming — Casual',
  'win-gaming-heavy':'Gaming — Zwaar','win-pro':'Zakelijk Windows',
  // legacy labels
  'mac-air':'MacBook Air','priv-office':'Privé — Dagelijks',
  'priv-school':'Privé — School','priv-photo':'Privé — Foto',
  'priv-video':'Privé — Video','priv-gaming-casual':'Gaming — Casual',
  'priv-gaming-heavy':'Gaming — Zwaar','zak-office':'Zakelijk — Office',
  'zak-photo':'Zakelijk — Design','zak-video-3d':'Zakelijk — Video/3D',
};

var STOEL_LABELS={
  'basis':'Klassieke bureaustoel','actief':'Dynamische zitoplossing',
  'ergonomisch':'Ergonomisch','rugklachten':'Rugklachten',
  'nek_schouder':'Nek/schouder',
};

function setTool(tool){
  TOOL=tool;
  ['all','laptops','stoelen'].forEach(function(t){
    document.getElementById('tab-'+t).classList.remove('active');
  });
  document.getElementById('tab-'+tool).classList.add('active');
  renderDashboard(filterRows(ALL_ROWS));
}

function setPeriod(d){
  PERIOD=d;
  ['p1','p7','p30','p0'].forEach(function(id){document.getElementById(id).classList.remove('active');});
  document.getElementById('p'+d).classList.add('active');
  renderDashboard(filterRows(ALL_ROWS));
}

function filterRows(rows){
  // Filter by demo domain
  var filtered=rows.filter(function(r){
    var d=r.domain||'';
    return d.indexOf('demo.theworkspacecompany')===-1;
  });
  // Filter by tool
  if(TOOL==='laptops'){
    filtered=filtered.filter(function(r){
      return !r.result||LAPTOP_LABELS[r.result]||r.result.indexOf('mac')>-1||r.result.indexOf('win')>-1||r.result.indexOf('dt-')>-1||r.result.indexOf('priv-')>-1||r.result.indexOf('zak-')>-1;
    });
    // Also filter by campaign
    filtered=filtered.filter(function(r){
      var d=r.domain||'';
      return d.indexOf('stoelen')===-1;
    });
  } else if(TOOL==='stoelen'){
    filtered=filtered.filter(function(r){
      return !r.result||STOEL_LABELS[r.result];
    });
  }
  // Filter by period
  if(PERIOD===0) return filtered;
  var cut=new Date(); cut.setDate(cut.getDate()-PERIOD);
  return filtered.filter(function(r){return new Date(r.timestamp)>=cut;});
}

function getLabel(result){
  return LAPTOP_LABELS[result]||STOEL_LABELS[result]||result||'—';
}

function loadData(){
  document.getElementById('status-badge').textContent='Laden...';
  document.getElementById('status-badge').className='badge';
  fetch(SHEET_URL)
    .then(function(r){return r.json();})
    .then(function(data){
      document.getElementById('status-badge').textContent='Live';
      document.getElementById('last-updated').textContent='Bijgewerkt: '+new Date().toLocaleTimeString('nl-BE');
      if(data.status==='ok'&&data.rows&&data.rows.length>0){
        ALL_ROWS=data.rows.map(function(r){return{
          timestamp:r.timestamp,event:r.event,
          step:r.stap||r.step,choice:r.keuze||r.choice,
          result:r.resultaat||r.result,lang:r.taal||r.lang,
          domain:r.domein||r.domain,
        };});
        renderDashboard(filterRows(ALL_ROWS));
      } else {
        document.getElementById('content').innerHTML='<div class="empty">Nog geen data.</div>';
      }
    })
    .catch(function(){
      document.getElementById('status-badge').textContent='Fout';
      document.getElementById('status-badge').className='badge err';
      document.getElementById('content').innerHTML='<div class="empty" style="color:#E55">Kon geen data laden.</div>';
    });
}

function renderDashboard(rows){
  var impressies=rows.filter(function(r){return r.event==='start';}).length;
  var voltooid=rows.filter(function(r){return r.event==='result';}).length;
  var restarts=rows.filter(function(r){return r.event==='restart';}).length;
  var sessions={};
  rows.filter(function(r){return r.event==='choice'||r.event==='result';}).forEach(function(r){
    var k=(r.domain||'')+'|'+(r.lang||'')+'|'+(r.timestamp||'').substring(0,16);
    sessions[k]=true;
  });
  var geactiveerd=Object.keys(sessions).length;
  var pct1=impressies>0?Math.round((geactiveerd/impressies)*100):0;
  var pct2=geactiveerd>0?Math.round((voltooid/geactiveerd)*100):0;
  var convRate=impressies>0?Math.round((voltooid/impressies)*100):0;
  var drop1=impressies>0?Math.round(((impressies-geactiveerd)/impressies)*100):0;
  var drop2=geactiveerd>0?Math.round(((geactiveerd-voltooid)/geactiveerd)*100):0;

  var resCounts={},choiceCounts={},langCounts={nl:0,en:0,fr:0},domCounts={};
  rows.forEach(function(r){
    if(r.event==='result'&&r.result) resCounts[r.result]=(resCounts[r.result]||0)+1;
    if((r.event==='choice'||r.event==='result')&&r.choice) choiceCounts[r.choice]=(choiceCounts[r.choice]||0)+1;
    if(r.lang&&langCounts[r.lang]!==undefined) langCounts[r.lang]++;
    if(r.domain){var d=r.domain.replace('https://','').replace('http://','');domCounts[d]=(domCounts[d]||0)+1;}
  });

  var sortRes=Object.keys(resCounts).sort(function(a,b){return resCounts[b]-resCounts[a];});
  var maxRes=sortRes.length?resCounts[sortRes[0]]:1;
  var sortChoice=Object.keys(choiceCounts).sort(function(a,b){return choiceCounts[b]-choiceCounts[a];}).slice(0,8);
  var maxChoice=sortChoice.length?choiceCounts[sortChoice[0]]:1;
  var sortDom=Object.keys(domCounts).sort(function(a,b){return domCounts[b]-domCounts[a];}).slice(0,6);
  var maxDom=sortDom.length?domCounts[sortDom[0]]:1;

  var tl=buildTimeline(rows);
  var recent=rows.slice(-15).reverse();

  var html='';

  // KPIs
  html+='<div class="kpi-row">';
  html+='<div class="kpi accent"><div class="kpi-label">Impressies</div><div class="kpi-val">'+impressies+'</div><div class="kpi-sub">Widget gezien</div></div>';
  html+='<div class="kpi"><div class="kpi-label">Geactiveerd</div><div class="kpi-val">'+geactiveerd+'</div><div class="kpi-sub">Eerste keuze gemaakt</div>'+(impressies>0?'<span class="kpi-pct neu">'+pct1+'%</span>':'')+'</div>';
  html+='<div class="kpi"><div class="kpi-label">Voltooid</div><div class="kpi-val">'+voltooid+'</div><div class="kpi-sub">Resultaat bereikt</div>'+(geactiveerd>0?'<span class="kpi-pct '+(pct2>30?'pos':'neu')+'">'+pct2+'%</span>':'')+'</div>';
  html+='<div class="kpi"><div class="kpi-label">Totale conversie</div><div class="kpi-val">'+convRate+'%</div><div class="kpi-sub">Impressie → resultaat</div></div>';
  html+='</div>';

  // Funnel
  var maxF=Math.max(impressies,geactiveerd,voltooid,1);
  var h1=Math.max(10,Math.round((impressies/maxF)*80));
  var h2=Math.max(6,Math.round((geactiveerd/maxF)*80));
  var h3=Math.max(3,Math.round((voltooid/maxF)*80));

  html+='<div class="funnel-card"><div class="card-title">Funnel — impressie → geactiveerd → voltooid</div>';
  html+='<div class="funnel-wrap">';
  html+='<div class="funnel-step"><div style="width:60%;height:'+h1+'px" class="funnel-bar f1"></div><div class="funnel-meta"><div class="funnel-meta-label">Impressies</div><div class="funnel-meta-count">'+impressies+'</div><div class="funnel-meta-pct">100%</div></div></div>';
  html+='<div class="funnel-arrow">›<div class="funnel-drop">-'+drop1+'%</div></div>';
  html+='<div class="funnel-step"><div style="width:60%;height:'+h2+'px" class="funnel-bar f2"></div><div class="funnel-meta"><div class="funnel-meta-label">Geactiveerd</div><div class="funnel-meta-count">'+geactiveerd+'</div><div class="funnel-meta-pct">'+pct1+'% van impressies</div></div></div>';
  html+='<div class="funnel-arrow">›<div class="funnel-drop">-'+drop2+'%</div></div>';
  html+='<div class="funnel-step"><div style="width:60%;height:'+h3+'px" class="funnel-bar f3"></div><div class="funnel-meta"><div class="funnel-meta-label">Voltooid</div><div class="funnel-meta-count">'+voltooid+'</div><div class="funnel-meta-pct">'+pct2+'% van actief</div></div></div>';
  html+='</div></div>';

  // Timeline
  html+='<div class="card" style="margin-bottom:20px">';
  html+='<div class="card-title">Activiteit over tijd</div>';
  html+='<div style="display:flex;gap:16px;margin-bottom:12px;font-size:11px;color:#777">';
  html+='<span><span style="display:inline-block;width:12px;height:2px;background:#3FA49C;vertical-align:middle;margin-right:4px;border-radius:2px"></span>Impressies</span>';
  html+='<span><span style="display:inline-block;width:12px;height:0;border-top:2px dashed #60C4BC;vertical-align:middle;margin-right:4px"></span>Geactiveerd</span>';
  html+='<span><span style="display:inline-block;width:12px;height:0;border-top:2px dotted #A8DED9;vertical-align:middle;margin-right:4px"></span>Voltooid</span>';
  html+='</div>';
  html+='<div class="chart-wrap"><canvas id="tlChart"></canvas></div>';
  html+='</div>';

  // Results + Choices
  html+='<div class="row2">';
  html+='<div class="card"><div class="card-title">Meest gekozen resultaten</div>';
  if(sortRes.length===0){html+='<div class="empty">Nog geen resultaten</div>';}
  else{sortRes.slice(0,10).forEach(function(k){var p=Math.round((resCounts[k]/maxRes)*100);html+='<div class="bar-row"><div class="bar-label">'+getLabel(k)+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+p+'%"></div></div><div class="bar-count">'+resCounts[k]+'</div></div>';});}
  html+='</div>';

  html+='<div class="card"><div class="card-title">Meest gemaakte keuzes</div>';
  if(sortChoice.length===0){html+='<div class="empty">Nog geen keuzes</div>';}
  else{sortChoice.forEach(function(k){var p=Math.round((choiceCounts[k]/maxChoice)*100);html+='<div class="bar-row"><div class="bar-label">'+k+'</div><div class="bar-wrap"><div class="bar-fill b2" style="width:'+p+'%"></div></div><div class="bar-count">'+choiceCounts[k]+'</div></div>';});}
  html+='</div></div>';

  // Recent + Meta
  html+='<div class="row3">';
  html+='<div class="card"><div class="card-title">Recente events</div>';
  if(recent.length===0){html+='<div class="empty">Nog geen events</div>';}
  else{
    html+='<table class="evt-table"><thead><tr><th>Tijd</th><th>Event</th><th>Keuze</th><th>Resultaat</th><th>Taal</th></tr></thead><tbody>';
    recent.forEach(function(r){html+='<tr><td>'+ft(r.timestamp)+'</td><td><span class="tag tag-'+r.event+'">'+r.event+'</span></td><td>'+(r.choice||'—')+'</td><td>'+getLabel(r.result)+'</td><td>'+(r.lang||'—')+'</td></tr>';});
    html+='</tbody></table>';
  }
  html+='</div>';

  html+='<div style="display:flex;flex-direction:column;gap:16px">';
  html+='<div class="card"><div class="card-title">Talen</div><div class="meta-row">';
  html+='<div class="lang-pill">NL <span class="cnt">'+langCounts.nl+'</span></div>';
  html+='<div class="lang-pill">FR <span class="cnt">'+langCounts.fr+'</span></div>';
  html+='<div class="lang-pill">EN <span class="cnt">'+langCounts.en+'</span></div>';
  html+='</div></div>';
  html+='<div class="card"><div class="card-title">Domeinen</div>';
  if(sortDom.length===0){html+='<div class="empty">Geen data</div>';}
  else{sortDom.forEach(function(d){var p=Math.round((domCounts[d]/maxDom)*100);html+='<div class="bar-row"><div class="bar-label" style="width:130px;font-size:11px">'+d.replace('.theworkspacecompany.com','')+'</div><div class="bar-wrap"><div class="bar-fill b3" style="width:'+p+'%"></div></div><div class="bar-count">'+domCounts[d]+'</div></div>';});}
  html+='</div>';
  if(restarts>0){html+='<div class="card"><div class="kpi-label">Herstarts</div><div style="font-family:Poppins;font-size:24px;font-weight:700;color:#111">'+restarts+'</div></div>';}
  html+='</div></div>';

  document.getElementById('content').innerHTML=html;
  drawTimeline(tl);
}

function buildTimeline(rows){
  var days={};
  rows.forEach(function(r){
    if(!r.timestamp) return;
    var d=new Date(r.timestamp);
    var k=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
    if(!days[k]) days[k]={imp:0,act:0,vol:0};
    if(r.event==='start') days[k].imp++;
    if(r.event==='choice') days[k].act++;
    if(r.event==='result') days[k].vol++;
  });
  var sorted=Object.keys(days).sort();
  if(!sorted.length) return{labels:[],imp:[],act:[],vol:[]};
  var start=new Date(sorted[0]),end=new Date(sorted[sorted.length-1]);
  var labels=[],imp=[],act=[],vol=[];
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    var k=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
    labels.push(p2(d.getDate())+'/'+p2(d.getMonth()+1));
    var v=days[k]||{imp:0,act:0,vol:0};
    imp.push(v.imp);act.push(v.act);vol.push(v.vol);
  }
  return{labels:labels,imp:imp,act:act,vol:vol};
}

function drawTimeline(data){
  var ctx=document.getElementById('tlChart');
  if(!ctx) return;
  if(tlChart){tlChart.destroy();tlChart=null;}
  if(!data.labels.length){ctx.parentElement.innerHTML='<div class="empty">Niet genoeg data voor tijdslijn</div>';return;}
  tlChart=new Chart(ctx,{
    type:'line',
    data:{labels:data.labels,datasets:[
      {label:'Impressies',data:data.imp,borderColor:'#3FA49C',backgroundColor:'rgba(63,164,156,.08)',fill:true,tension:.3,pointRadius:3,borderWidth:2},
      {label:'Geactiveerd',data:data.act,borderColor:'#60C4BC',backgroundColor:'transparent',fill:false,tension:.3,pointRadius:3,borderWidth:2,borderDash:[5,3]},
      {label:'Voltooid',data:data.vol,borderColor:'#A8DED9',backgroundColor:'transparent',fill:false,tension:.3,pointRadius:3,borderWidth:2,borderDash:[2,2]},
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:11},color:'#AAA',maxRotation:45,autoSkip:true,maxTicksLimit:14}},
        y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:11},color:'#AAA',stepSize:1}}
      }
    }
  });
}

function p2(n){return n<10?'0'+n:String(n);}
function ft(ts){
  if(!ts) return '—';
  try{var d=new Date(ts);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes());}
  catch(e){return ts;}
}

setInterval(loadData,60000);
loadData();
</script>
