<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>Keuzehulp Laptop & Desktop — The Workspace Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;background:#FAFAFA;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:14px;color:#1a1a1a}
body{padding:24px 20px}

/* progress */
.kb-prog{display:flex;gap:4px;margin-bottom:24px}
.kb-pd{height:3px;border-radius:2px;flex:1;background:#EEE;transition:background .25s}
.kb-pd.done{background:#3FA49C}
.kb-pd.act{background:#CCC}

/* stappen */
.kb-step{display:none}
.kb-step.on{display:block;animation:kbfade .18s ease}
@keyframes kbfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* eyebrow / title / sub */
.kb-ey{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3FA49C;margin-bottom:4px}
.kb-ti{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:#1a1a1a;line-height:1.25;margin-bottom:4px}
.kb-su{font-size:12px;color:#737373;line-height:1.5;margin-bottom:18px}

/* grid */
.kb-grid{display:grid;gap:9px;margin-bottom:4px}
.kb-g2{grid-template-columns:1fr 1fr}
.kb-g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){.kb-g2,.kb-g3{grid-template-columns:1fr 1fr}}
@media(max-width:340px){.kb-g2,.kb-g3{grid-template-columns:1fr}}

/* optiekaart */
.kb-opt{background:#fff;border:1.5px solid #E8E8E8;border-radius:8px;padding:12px 13px;cursor:pointer;text-align:left;width:100%;transition:border-color .12s,box-shadow .12s;display:block;font-family:inherit}
.kb-opt:hover{border-color:#3FA49C;box-shadow:0 0 0 3px rgba(63,164,156,.1)}
.kb-opt:active{border-color:#2F8A82;background:#F5FAFA}
.kb-ico{font-size:18px;margin-bottom:4px;display:block}
.kb-nm{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:2px;display:block}
.kb-ds{font-size:11px;color:#737373;line-height:1.35;display:block}

/* crumb + nav */
.kb-nav{display:flex;align-items:center;gap:10px;margin-top:16px}
.kb-bk{background:none;border:1px solid #D4D4D4;border-radius:4px;padding:6px 12px;font-size:12px;color:#737373;cursor:pointer;font-family:inherit}
.kb-bk:hover{border-color:#2B2B2B;color:#1a1a1a}
.kb-cr{font-size:11px;color:#A3A3A3;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kb-cr b{color:#4F4F4F;font-weight:500}

/* resultaat */
.kb-rc{background:#fff;border:1px solid #E8E8E8;border-radius:8px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px}
.kb-rl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A3A3A3;margin-bottom:5px}
.kb-rn{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:3px}
.kb-rd{font-size:12px;color:#737373;line-height:1.5;margin-bottom:14px}
.kb-go{display:inline-flex;align-items:center;gap:6px;background:#3FA49C;color:#fff;text-decoration:none;border-radius:4px;padding:10px 20px;font-size:13px;font-weight:600}
.kb-go:hover{background:#2F8A82;color:#fff;text-decoration:none}
.kb-tip{background:#FFF8E6;border:1px solid #FFECB8;border-radius:4px;padding:9px 12px;font-size:12px;color:#6F4E00;line-height:1.5;margin-top:10px}
.kb-rst{display:inline-block;margin-top:14px;background:none;border:1px solid #D4D4D4;border-radius:4px;padding:6px 13px;font-size:12px;color:#737373;cursor:pointer;font-family:inherit}
.kb-rst:hover{border-color:#2B2B2B;color:#1a1a1a}
</style>
</head>

  <div class="kb-step on" id="ks0">

      { i:'📐', n:'2D / 3D ontwerp',       d:'AutoCAD, Blender — Windows',               res:'c-3d-win' },
      { i:'🍎', n:'Creatief gebruik',      d:'Foto, video, design — macOS',              res:'c-mac' },
    ]
  },
  /* Stap 2: gaming */
  'task-gaming': {
    ey:'Stap 3 van 3', ti:'Hoe intensief ga je gamen?',
    su:'Dit bepaalt de videokaart en het scherm.',
    cols:2,
    opts:[
      { i:'🕹️', n:'Casual / e-sports',   d:'Indie games, shooters, full HD',     res:'g-light' },
      { i:'🎮', n:'Zwaar (AAA / 4K)',    d:'High-end games, hoge refresh rate',   res:'g-heavy' },
    ]
  },
};

/* ── HELPERS ── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function mkBtn(icon, name, desc, onclick) {
  var b = document.createElement('button');
  b.className = 'kb-opt';
  b.innerHTML = '<span class="kb-ico">'+icon+'</span><span class="kb-nm">'+esc(name)+'</span><span class="kb-ds">'+esc(desc)+'</span>';
  b.addEventListener('click', onclick);
  return b;
}

function showStep(id) {
  document.querySelectorAll('#wk .kb-step').forEach(function(s){ s.classList.remove('on'); });
  document.getElementById(id).classList.add('on');
  // resize bericht naar parent iframe
  setTimeout(function(){
    var h = document.getElementById('wk').scrollHeight;
    window.parent.postMessage({ wscHeight: h + 48 }, '*');
  }, 50);
}

function prog() {
  var el = document.getElementById('kb-prog');
  el.innerHTML = '';
  for (var i = 0; i < TOTAL; i++) {
    var d = document.createElement('div');
    d.className = 'kb-pd' + (i < S.step ? ' done' : i === S.step ? ' act' : '');
    el.appendChild(d);
  }
}

function crumb() {
  var labels = [], a = S.a;
  if (a.d0) labels.push({ 'ctx-lap':'Laptop', 'ctx-desk':'Desktop' }[a.d0] || '');
  if (a.d1) {
    var map = { 'task-home':'Thuisgebruik','task-student':'Student','task-zak':'Zakelijk','task-creative':'Creatief','task-gaming':'Gaming','ctx-desk':'Desktop' };
    labels.push(map[a.d1] || '');
  }
  var html = labels.filter(Boolean).map(function(l){ return '<b>'+esc(l)+'</b>'; }).join(' › ');
  document.querySelectorAll('.kb-cr').forEach(function(el){ el.innerHTML = html; });
}

/* ── RENDER STAP ── */
function renderStap(stap, gridId, eyId, tiId, suId, bkId, crId, depth) {
  var def = STAPPEN[stap];
  if (!def) return;
  document.getElementById(eyId).textContent = def.ey;
  document.getElementById(tiId).textContent = def.ti;
  document.getElementById(suId).textContent = def.su;
  var grid = document.getElementById(gridId);
  grid.className = 'kb-grid kb-g' + (def.cols || 2);
  grid.innerHTML = '';
  def.opts.forEach(function(opt) {
    var btn = mkBtn(opt.i, opt.n, opt.d, function() {
      if (opt.res) {
        // Direct naar resultaat
        showResult(opt.res);
      } else if (opt.next) {
        // Naar volgende stap
        if (depth === 0) { S.a.d0 = opt.next; S.step = 1; renderStap1(opt.next); }
        else             { S.a.d1 = opt.next; S.step = 2; renderStap2(opt.next); }
      }
      crumb();
    });
    grid.appendChild(btn);
  });
}

function renderStap1(stap) {
  renderStap(stap, 'kb-s1', 'kb-ey1', 'kb-ti1', 'kb-su1', 'kb-bk1', 'kb-cr1', 1);
  prog(); showStep('ks1');
}

function renderStap2(stap) {
  renderStap(stap, 'kb-s2', 'kb-ey2', 'kb-ti2', 'kb-su2', 'kb-bk2', 'kb-cr2', 2);
  prog(); showStep('ks2');
}

/* ── BASE URL (uit ?base= URL parameter) ── */
var baseUrl = (function() {
  var m = window.location.search.match(/[?&]base=([^&]+)/);
  return m ? decodeURIComponent(m[1]).replace(/\/$/, '') : '';
})();

/* ── RESULTAAT ── */
function showResult(key) {
  var r = RES[key];
  var u = URLS[key];
  if (!r || !u) return;
  S.step = 3;
  // Zet juiste base URL (parent shop of fallback naar relatief)
  var fullUrl = baseUrl ? baseUrl + u : u;
  document.getElementById('kb-res-ti').textContent = r.ti;
  document.getElementById('kb-res-su').textContent = r.su;
  var body = document.getElementById('kb-res-body');
  body.innerHTML = '<div class="kb-rc">'
    + '<div class="kb-rl">Jouw aanbod</div>'
    + '<div class="kb-rn">'+esc(r.ti)+'</div>'
    + '<div class="kb-rd">'+esc(r.su)+'</div>'
    + '<a class="kb-go" href="'+esc(fullUrl)+'" target="_top">Bekijk aanbod →</a>'
    + (r.tip ? '<div class="kb-tip">'+esc(r.tip)+'</div>' : '')
    + '</div>';
  prog(); showStep('ks-res');
}

/* ── INITIALISEER ── */
// Stap 0
var g0 = document.getElementById('kb-s0');
g0.className = 'kb-grid kb-g2';
STAPPEN.s0.opts.forEach(function(opt) {
  var btn = mkBtn(opt.i, opt.n, opt.d, function() {
    S.a.d0 = opt.next; S.step = 1;
    renderStap1(opt.next);
    crumb();
  });
  g0.appendChild(btn);
});

// Terug knoppen
document.getElementById('kb-bk1').addEventListener('click', function() {
  S.step = 0; S.a = {};
  prog(); crumb(); showStep('ks0');
});
document.getElementById('kb-bk2').addEventListener('click', function() {
  S.step = 1; delete S.a.d1;
  renderStap1(S.a.d0);
  crumb();
});

// Opnieuw
document.getElementById('kb-rst').addEventListener('click', function() {
  S.step = 0; S.a = {};
  prog(); crumb(); showStep('ks0');
});

prog();

// Stuur initiële hoogte naar parent
window.addEventListener('load', function() {
  var h = document.getElementById('wk').scrollHeight;
  window.parent.postMessage({ wscHeight: h + 48 }, '*');
});

})();
</script>
</body>
</html>
