body{padding:20px}
.kb-prog{display:flex;gap:4px;margin-bottom:22px}
.kb-pd{height:3px;border-radius:2px;flex:1;background:#EEE;transition:background .25s}
.kb-pd.done{background:#3FA49C}.kb-pd.act{background:#CCC}
.kb-step{display:none}.kb-step.on{display:block;animation:kbfade .18s ease}

.kb-ey{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3FA49C;margin-bottom:4px}

.kb-grid{display:grid;gap:8px;margin-bottom:4px}
.kb-g2{grid-template-columns:1fr 1fr}.kb-g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:500px){.kb-g2,.kb-g3{grid-template-columns:1fr 1fr}}
@media(max-width:340px){.kb-g2,.kb-g3{grid-template-columns:1fr}}
.kb-opt{background:#fff;border:1.5px solid #E8E8E8;border-radius:8px;padding:12px 13px;cursor:pointer;text-align:left;width:100%;transition:border-color .12s,box-shadow .12s;display:block;font-family:inherit}
.kb-opt:hover{border-color:#3FA49C;box-shadow:0 0 0 3px rgba(63,164,156,.1)}
.kb-opt:active{border-color:#2F8A82;background:#F5FAFA}
.kb-ico{font-size:18px;margin-bottom:4px;display:block}
.kb-nm{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:2px;display:block}
.kb-ds{font-size:11px;color:#737373;line-height:1.35;display:block}
.kb-nav{display:flex;align-items:center;gap:10px;margin-top:14px}
.kb-bk{background:none;border:1px solid #D4D4D4;border-radius:4px;padding:6px 12px;font-size:12px;color:#737373;cursor:pointer;font-family:inherit}
.kb-bk:hover{border-color:#2B2B2B;color:#1a1a1a}
.kb-cr{font-size:11px;color:#A3A3A3;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kb-cr b{color:#4F4F4F;font-weight:500}
.kb-rc{background:#fff;border:1px solid #E8E8E8;border-radius:8px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kb-rl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#A3A3A3;margin-bottom:5px}
.kb-rn{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:3px}
.kb-rd{font-size:12px;color:#737373;line-height:1.5;margin-bottom:14px}
.kb-go{display:inline-flex;align-items:center;gap:6px;background:#3FA49C;color:#fff;text-decoration:none;border-radius:4px;padding:10px 20px;font-size:13px;font-weight:600}
.kb-go:hover{background:#2F8A82;color:#fff;text-decoration:none}
.kb-tip{background:#FFF8E6;border:1px solid #FFECB8;border-radius:4px;padding:9px 12px;font-size:12px;color:#6F4E00;line-height:1.5;margin-top:10px}
.kb-rst{display:inline-block;margin-top:14px;background:none;border:1px solid #D4D4D4;border-radius:4px;padding:6px 13px;font-size:12px;color:#737373;cursor:pointer;font-family:inherit}

    {i:'🎬',n:'Foto- & videobewerking', d:'Premiere Pro, After Effects',   next:'creative-video-os'},

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function resize(){
  setTimeout(function(){
    window.parent.postMessage({wscHeight:document.getElementById('wk').scrollHeight+40},'*');
  },60);
}

function showStep(id){
  document.querySelectorAll('#wk .kb-step').forEach(function(s){s.classList.remove('on');});
  document.getElementById(id).classList.add('on');
  resize();
}

function prog(){
  var el=document.getElementById('kb-prog');
  el.innerHTML='';
  for(var i=0;i<TOTAL;i++){
    var d=document.createElement('div');
    d.className='kb-pd'+(i<S.step?' done':i===S.step?' act':'');
    el.appendChild(d);
  }
}

function updateCrumbs(){
  var html=S.trail.map(function(l){return'<b>'+esc(l)+'</b>';}).join(' › ');
  document.querySelectorAll('.kb-cr').forEach(function(el){el.innerHTML=html;});
}

function mkBtn(icon,name,desc,onclick){
  var b=document.createElement('button');
  b.className='kb-opt';
  b.innerHTML='<span class="kb-ico">'+icon+'</span><span class="kb-nm">'+esc(name)+'</span><span class="kb-ds">'+esc(desc)+'</span>';
  b.addEventListener('click',onclick);
  return b;
}

var STEP_IDS=[null,'ks1','ks2','ks3'];
var GRID_IDS=[null,'kb-s1','kb-s2','kb-s3'];
var EY_IDS=[null,'kb-ey1','kb-ey2','kb-ey3'];
var TI_IDS=[null,'kb-ti1','kb-ti2','kb-ti3'];
var SU_IDS=[null,'kb-su1','kb-su2','kb-su3'];

function renderNode(nodeKey, depth, label){
  var node=TREE[nodeKey];
  if(!node) return;
  S.history.push(nodeKey);
  if(label) S.trail.push(label);
  S.step=depth;

  document.getElementById(EY_IDS[depth]).textContent=node.ey||('Stap '+(depth+1)+' van 4');
  document.getElementById(TI_IDS[depth]).textContent=node.ti||'';
  document.getElementById(SU_IDS[depth]).textContent=node.su||'';

  var grid=document.getElementById(GRID_IDS[depth]);
  grid.className='kb-grid kb-g'+(node.cols||2);
  grid.innerHTML='';

  node.opts.forEach(function(opt){
    grid.appendChild(mkBtn(opt.i,opt.n,opt.d,function(){
      if(opt.res){
        S.trail.push(opt.n);
        showResult(opt.res);
      } else if(opt.next){
        renderNode(opt.next, depth+1, opt.n);
      }
      updateCrumbs();
    }));
  });

  prog(); updateCrumbs(); showStep(STEP_IDS[depth]);
}

function showResult(key){
  var r=RES[key];
  if(!r) return;
  S.step=TOTAL;
  document.getElementById('kb-res-body').innerHTML=
    '<div class="kb-rc">'
    +'<div class="kb-rl">Jouw aanbod</div>'
    +'<div class="kb-rn">'+esc(r.ti)+'</div>'
    +'<div class="kb-rd">'+esc(r.rd)+'</div>'
    +'<a class="kb-go" href="'+esc(r.url)+'" target="_top">Bekijk aanbod →</a>'
    +(r.tip?'<div class="kb-tip">'+esc(r.tip)+'</div>':'')
    +'</div>';
  prog(); updateCrumbs(); showStep('ks-res');
}

function restart(){
  S.step=0; S.history=[]; S.trail=[];
  prog(); updateCrumbs(); showStep('ks0');
}

function goBack(){
  if(S.history.length===0){restart();return;}
  S.history.pop();
  S.trail.pop();
  var depth=S.history.length;
  if(depth===0){restart();return;}
  // herstel de vorige node
  var prevKey=S.history[depth-1];
  S.history.pop();
  if(S.trail.length>0) S.trail.pop();
  renderNode(prevKey, depth, null);
}

// Stap 0 init
var g0=document.getElementById('kb-s0');
TREE.root.opts.forEach(function(opt){
  g0.appendChild(mkBtn(opt.i,opt.n,opt.d,function(){
    S.history=[]; S.trail=[opt.n];
    renderNode(opt.next,1,null);
    updateCrumbs();
  }));
});

document.getElementById('kb-bk1').addEventListener('click',function(){restart();});
document.getElementById('kb-bk2').addEventListener('click',function(){goBack();});
document.getElementById('kb-bk3').addEventListener('click',function(){goBack();});
document.getElementById('kb-rst').addEventListener('click',function(){restart();});

prog();
window.addEventListener('load',function(){resize();});
})();
</script>
