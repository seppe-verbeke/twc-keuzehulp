<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuzehulp Dashboard — The Workspace Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F5F7FA;color:#1a1a1a;min-height:100vh}
.top{background:#fff;border-bottom:1px solid #EBEBEB;padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
.top-title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:#111}
.top-sub{font-size:12px;color:#999;margin-top:2px}
.top-right{display:flex;align-items:center;gap:12px}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:#F0FAF9;color:#3FA49C;border:1px solid #C5EAE7}
.refresh-btn{background:none;border:1px solid #EBEBEB;border-radius:6px;padding:6px 12px;font-size:12px;color:#555;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:border-color .15s}
.refresh-btn:hover{border-color:#3FA49C;color:#3FA49C}
.main{padding:24px 32px;max-width:1200px;margin:0 auto}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid #EBEBEB;border-radius:8px;padding:20px 24px}
.kpi-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#AAA;margin-bottom:8px}
.kpi-val{font-family:'Poppins',sans-serif;font-size:32px;font-weight:700;color:#111;line-height:1}
.kpi-sub{font-size:11px;color:#AAA;margin-top:6px}
.kpi-accent{border-top:3px solid #3FA49C}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.card{background:#fff;border:1px solid #EBEBEB;border-radius:8px;padding:20px 24px}
.card-title{font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:#111;margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-size:12px;color:#555;width:180px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-wrap{flex:1;background:#F5F7FA;border-radius:4px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:#3FA49C;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar-fill.accent2{background:#60C4BC}
.bar-fill.accent3{background:#A8DED9}
.bar-count{font-size:11px;color:#AAA;width:30px;text-align:right;flex-shrink:0}
.event-table{width:100%;border-collapse:collapse;font-size:12px}
.event-table th{text-align:left;padding:8px 10px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#AAA;border-bottom:1px solid #EBEBEB}
.event-table td{padding:8px 10px;border-bottom:1px solid #F5F7FA;color:#444}
.event-table tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.tag-start{background:#EEF2FF;color:#4F46E5}
.tag-choice{background:#FFF7ED;color:#C2410C}
.tag-result{background:#F0FAF9;color:#0F766E}
.tag-restart{background:#FDF4FF;color:#7E22CE}
.loading{text-align:center;padding:60px;color:#AAA;font-size:14px}
.error{text-align:center;padding:40px;color:#E55;font-size:13px}
.empty{text-align:center;padding:40px;color:#AAA;font-size:13px}
.last-updated{font-size:11px;color:#BBB}
.lang-row{display:flex;gap:8px;flex-wrap:wrap}
.lang-pill{background:#F5F7FA;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:#555}
.lang-pill span{color:#3FA49C;margin-left:4px}
.funnel-row{display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:8px}
.funnel-bar{flex:1;background:#3FA49C;border-radius:4px 4px 0 0;min-height:4px;transition:height .6s}
.funnel-label{font-size:10px;color:#AAA;text-align:center;margin-top:6px}
.funnel-wrap{display:flex;flex-direction:column}
@media(max-width:768px){
  .kpi-row{grid-template-columns:1fr 1fr}
  .row2,.row3{grid-template-columns:1fr}
  .main{padding:16px}
  .top{padding:12px 16px}
}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="top-title">Keuzehulp Dashboard</div>
    <div class="top-sub">The Workspace Company — live tracking</div>
  </div>
  <div class="top-right">
    <span class="badge" id="status-badge">Laden...</span>
    <button class="refresh-btn" onclick="loadData()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      Vernieuwen
    </button>
    <span class="last-updated" id="last-updated"></span>
  </div>
</div>

<div class="main">
  <div id="content"><div class="loading">Data laden...</div></div>
</div>

<script>
var SHEET_URL = 'https://script.google.com/macros/s/AKfycbx_UmVZsveDAb36OCvzoxM-KBGU2peH-nCeto3cRFbd6hUhZu2KjDGo0_ycJAqKo1s/exec';

var RESULT_LABELS = {
  'dt-gaming': 'Gaming desktop',
  'dt-office': 'Zakelijke desktop',
  'mac-air': 'MacBook Air',
  'mac-pro': 'MacBook Pro',
  'priv-office': 'Privé — Dagelijks gebruik',
  'priv-school': 'Privé — School/studie',
  'priv-photo': 'Privé — Fotobewerking',
  'priv-video': 'Privé — Video/fotobewerking',
  'priv-gaming-casual': 'Gaming — Casual',
  'priv-gaming-heavy': 'Gaming — Zwaar/AAA',
  'zak-office': 'Zakelijk — Mail/Office',
  'zak-photo': 'Zakelijk — Design/foto',
  'zak-video-3d': 'Zakelijk — Video/3D',
};

function loadData() {
  document.getElementById('status-badge').textContent = 'Laden...';
  document.getElementById('last-updated').textContent = '';

  fetch(SHEET_URL)
    .then(function(r){ return r.json(); })
    .then(function(data){
      document.getElementById('status-badge').textContent = 'Live';
      document.getElementById('last-updated').textContent = 'Bijgewerkt: ' + new Date().toLocaleTimeString('nl-BE');
      if(data.status === 'ok' && data.rows && data.rows.length > 0){
        renderDashboard(data.rows);
      } else {
        renderEmpty();
      }
    })
    .catch(function(err){
      document.getElementById('status-badge').textContent = 'Fout';
      document.getElementById('content').innerHTML = '<div class="error">Kon geen data laden. Controleer of de Apps Script correct gedeployed is.</div>';
    });
}

function renderEmpty() {
  document.getElementById('content').innerHTML = 
    '<div class="empty">Nog geen data. Doorloop de keuzehulp om de eerste events te registreren.</div>';
}

function renderDashboard(rows) {
  var starts   = rows.filter(function(r){ return r.event==='start'; }).length;
  var choices  = rows.filter(function(r){ return r.event==='choice'; }).length;
  var results  = rows.filter(function(r){ return r.event==='result'; }).length;
  var restarts = rows.filter(function(r){ return r.event==='restart'; }).length;
  var convRate = starts > 0 ? Math.round((results/starts)*100) : 0;

  // Results breakdown
  var resultCounts = {};
  rows.filter(function(r){ return r.event==='result'; }).forEach(function(r){
    resultCounts[r.result] = (resultCounts[r.result]||0) + 1;
  });
  var sortedResults = Object.keys(resultCounts).sort(function(a,b){ return resultCounts[b]-resultCounts[a]; });
  var maxResult = sortedResults.length ? resultCounts[sortedResults[0]] : 1;

  // Choices breakdown
  var choiceCounts = {};
  rows.filter(function(r){ return r.event==='choice'||r.event==='result'; }).forEach(function(r){
    var label = r.choice;
    if(label) choiceCounts[label] = (choiceCounts[label]||0) + 1;
  });
  var sortedChoices = Object.keys(choiceCounts).sort(function(a,b){ return choiceCounts[b]-choiceCounts[a]; }).slice(0,8);
  var maxChoice = sortedChoices.length ? choiceCounts[sortedChoices[0]] : 1;

  // Language breakdown
  var langCounts = {nl:0,en:0,fr:0};
  rows.forEach(function(r){ if(r.lang && langCounts[r.lang]!==undefined) langCounts[r.lang]++; });

  // Domain breakdown
  var domainCounts = {};
  rows.forEach(function(r){
    if(r.domain){
      var d = r.domain.replace('https://','').replace('http://','');
      domainCounts[d] = (domainCounts[d]||0) + 1;
    }
  });
  var sortedDomains = Object.keys(domainCounts).sort(function(a,b){ return domainCounts[b]-domainCounts[a]; }).slice(0,5);

  // Recent events
  var recent = rows.slice(-10).reverse();

  var html = '';

  // KPIs
  html += '<div class="kpi-row">';
  html += kpi('Totaal gestart', starts, 'Unieke sessies', true);
  html += kpi('Resultaten bereikt', results, convRate+'% conversie');
  html += kpi('Tussenkeuzes', choices, 'Totaal klikken');
  html += kpi('Opnieuw begonnen', restarts, 'Van de starts');
  html += '</div>';

  // Results + Choices
  html += '<div class="row2">';

  // Results breakdown
  html += '<div class="card"><div class="card-title">Meest gekozen resultaten</div>';
  if(sortedResults.length === 0){
    html += '<div class="empty" style="padding:20px">Nog geen resultaten</div>';
  } else {
    sortedResults.forEach(function(key){
      var pct = Math.round((resultCounts[key]/maxResult)*100);
      html += '<div class="bar-row">';
      html += '<div class="bar-label">'+(RESULT_LABELS[key]||key)+'</div>';
      html += '<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%"></div></div>';
      html += '<div class="bar-count">'+resultCounts[key]+'</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  // Top choices
  html += '<div class="card"><div class="card-title">Meest gemaakte keuzes</div>';
  if(sortedChoices.length === 0){
    html += '<div class="empty" style="padding:20px">Nog geen keuzes</div>';
  } else {
    sortedChoices.forEach(function(key){
      var pct = Math.round((choiceCounts[key]/maxChoice)*100);
      html += '<div class="bar-row">';
      html += '<div class="bar-label">'+key+'</div>';
      html += '<div class="bar-wrap"><div class="bar-fill accent2" style="width:'+pct+'%"></div></div>';
      html += '<div class="bar-count">'+choiceCounts[key]+'</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  html += '</div>'; // row2

  // Recent events + meta
  html += '<div class="row3">';

  // Recent events
  html += '<div class="card"><div class="card-title">Recente events</div>';
  if(recent.length === 0){
    html += '<div class="empty" style="padding:20px">Nog geen events</div>';
  } else {
    html += '<table class="event-table"><thead><tr><th>Tijd</th><th>Event</th><th>Keuze</th><th>Resultaat</th><th>Taal</th></tr></thead><tbody>';
    recent.forEach(function(r){
      html += '<tr>';
      html += '<td>'+formatTime(r.timestamp)+'</td>';
      html += '<td><span class="tag tag-'+r.event+'">'+r.event+'</span></td>';
      html += '<td>'+(r.choice||'—')+'</td>';
      html += '<td>'+(r.result ? (RESULT_LABELS[r.result]||r.result) : '—')+'</td>';
      html += '<td>'+(r.lang||'—')+'</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';

  // Meta: talen + domeinen
  html += '<div style="display:flex;flex-direction:column;gap:16px">';

  html += '<div class="card"><div class="card-title">Talen</div>';
  html += '<div class="lang-row">';
  html += '<div class="lang-pill">NL<span>'+langCounts.nl+'</span></div>';
  html += '<div class="lang-pill">FR<span>'+langCounts.fr+'</span></div>';
  html += '<div class="lang-pill">EN<span>'+langCounts.en+'</span></div>';
  html += '</div></div>';

  html += '<div class="card"><div class="card-title">Domeinen</div>';
  if(sortedDomains.length === 0){
    html += '<div style="font-size:12px;color:#AAA">Nog geen data</div>';
  } else {
    var maxD = domainCounts[sortedDomains[0]];
    sortedDomains.forEach(function(d){
      var pct = Math.round((domainCounts[d]/maxD)*100);
      html += '<div class="bar-row">';
      html += '<div class="bar-label" style="width:140px;font-size:11px">'+d+'</div>';
      html += '<div class="bar-wrap"><div class="bar-fill accent3" style="width:'+pct+'%"></div></div>';
      html += '<div class="bar-count">'+domainCounts[d]+'</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  html += '</div>'; // meta column
  html += '</div>'; // row3

  document.getElementById('content').innerHTML = html;
}

function kpi(label, val, sub, accent) {
  return '<div class="kpi'+(accent?' kpi-accent':'')+'"><div class="kpi-label">'+label+'</div><div class="kpi-val">'+val+'</div><div class="kpi-sub">'+sub+'</div></div>';
}

function formatTime(ts) {
  if(!ts) return '—';
  try {
    var d = new Date(ts);
    return d.toLocaleDateString('nl-BE',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
  } catch(e){ return ts; }
}

// Auto-refresh every 60 seconds
setInterval(loadData, 60000);
loadData();
</script>
</body>
</html>
